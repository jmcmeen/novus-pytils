[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --color=yes --durations=10
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    audio: Audio processing tests
    video: Video processing tests
    image: Image processing tests
    file_ops: File operations tests
    api: API tests
    cli: CLI tests